name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no tag, no publish, no GitHub release)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require dispatch against main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Release can only be dispatched against main (got ${{ github.ref }})."
            exit 1
          fi

  checks:
    needs: guard
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require historical release baseline
        run: git rev-parse --verify refs/tags/v1.6.0
      - name: Prepare package
        run: pnpm release:prepare
      - name: Publish using npm trusted publishing
        run: pnpm release ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
