name: Deploy demo to Cloud Run

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy demo to Cloud Run
    uses: ./.github/workflows/deploy-service.yml
    with:
      service_name: tanstack-router-ga4
      dockerfile: packages/example-website/Dockerfile
      context: .
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
